<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunk Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #eef2f3;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 350px;
            margin: auto;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .progress-bar {
            width: 90%;
            background-color: #ddd;
            border-radius: 5px;
            margin: 10px auto;
            overflow: hidden;
        }
        .progress {
            height: 20px;
            background: #007bff;
            width: 0%;
            text-align: center;
            color: white;
            line-height: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .result { margin-top: 20px; font-weight: bold; padding: 10px; border-radius: 5px; }
        .safe { color: green; }
        .warning { color: orange; }
        .danger { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bunk Calculator</h2>
        <label>Classes Attended:</label>
        <input type="number" id="attendedClasses" min="0" required oninput="calculateBunks()">
        <label>Total Classes Conducted:</label>
        <input type="number" id="totalClasses" min="1" required oninput="calculateBunks()">
        <div class="progress-bar"><div id="progress" class="progress">0%</div></div>
        <div class="result" id="output"></div>
    </div>
    <script>
        function calculateBunks() {
            let total = document.getElementById("totalClasses").value;
            let attended = document.getElementById("attendedClasses").value;

            if (total === "" || attended === "") {
                document.getElementById("output").innerHTML = "";
                document.getElementById("progress").style.width = "0%";
                document.getElementById("progress").innerText = "0%";
                return;
            }

            total = parseInt(total);
            attended = parseInt(attended);

            if (isNaN(total) || isNaN(attended) || total <= 0 || attended < 0 || attended > total) {
                document.getElementById("output").innerHTML = "<span class='danger'>Please enter valid numbers.</span>";
                document.getElementById("progress").style.width = "0%";
                document.getElementById("progress").innerText = "0%";
                return;
            }

            let currentAttendance = ((attended / total) * 100).toFixed(2);
            document.getElementById("progress").style.width = currentAttendance + "%";
            document.getElementById("progress").innerText = currentAttendance + "%";

            // Max number of bunks while maintaining 85%
            let maxBunks85 = Math.floor((attended - 0.85 * total) / 0.85);
            if (maxBunks85 < 0) maxBunks85 = 0;

            // Max number of bunks while maintaining 75%
            let maxBunks75 = Math.floor((attended - 0.75 * total) / 0.75);
            if (maxBunks75 < 0) maxBunks75 = 0;

            let result = `<p>📊 Current Attendance: <b>${currentAttendance}%</b></p>`;

            if (currentAttendance >= 85) {
                result += `<span class="safe">✅ You can bunk <b>${maxBunks85}</b> more classes and still get full attendance marks (85%).</span><br>`;
            } else {
                let requiredFor85 = Math.ceil((0.85 * total - attended) / (1 - 0.85));
                result += `<span class="danger">❌ You need to attend <b>${requiredFor85}</b> more classes to reach 85%.</span><br>`;
            }

            if (currentAttendance >= 75) {
                result += `<span class="warning">⚠️ You can bunk <b>${maxBunks75}</b> more classes and still be eligible for exams (75%).</span><br>`;
            } else {
                let requiredFor75 = Math.ceil((0.75 * total - attended) / (1 - 0.75));
                result += `<span class="danger">❌ You need to attend <b>${requiredFor75}</b> more classes to reach 75%.</span>`;
            }

            document.getElementById("output").innerHTML = result;
        }
    </script>
</body>
</html>
